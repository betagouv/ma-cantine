<style>
    .provisional-alert {
        width: 100%;
        margin-bottom: 24px;
        border: 1px solid #0063cb;
    }

    .provisional-alert__band {
        width: 30px;
        padding: 4px 0px 0px 0px;
        background-color: #0063cb;
        text-align: center;
        vertical-align: top;
    }

    .provisional-alert__content {
        padding: 8px 16px 4px 6px;
    }

    p.provisional-alert__text {
        margin: 0px;
        font-family: 'Marianne-Light';
    }
</style>
{% if is_provisional %}
<table class="provisional-alert">
    <tr>
        <td class="provisional-alert__band">
            <img alt="" width="24" height="24" src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23ffffff" d="M19.5,2.5h-15c-1.1,0-2,0.9-2,2v15c0,1.1,0.9,2,2,2h15c1.1,0,2-0.9,2-2v-15C21.5,3.4,20.6,2.5,19.5,2.5z M13,17h-2v-6h2V17z M13,9h-2V7h2V9z"/></svg>' />
        </td>
        <td class="provisional-alert__content">
            <p class="provisional-alert__text">
                <span class="text-bold">Justificatif provisoire</span>, jusqu'à la clôture de la télédéclaration, {{ end_campaign_date|date:"j F Y" }}.
                Jusqu'à cette date, la télédéclaration peut encore être modifiée ;
                un justificatif définitif sera alors disponible dans votre espace.
            </p>
        </td>
    </tr>
</table>
{% endif %}
