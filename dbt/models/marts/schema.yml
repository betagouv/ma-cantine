version: 2

models:
  - name: mart_cantines
    description: >
      Une ligne par cantine active (hors supprimées). Aligné sur trois références :
      le Registre national des cantines (RNC, open data data.gouv, `CanteenOpenDataSerializer`
      dans api/serializers/canteen.py), l'observatoire (api/views/statistics.py) et le rapport
      au parlement (mart_teledeclarations). Les noms de colonnes reprennent ceux du modèle
      Metabase 964. Les chaînes vides sont remplacées par null sur toutes les colonnes texte
      où les données en contenaient (relevé du 05/10/2026).
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    columns:
      - name: id
        description: Identifiant unique de la cantine. = `id` dans le RNC.
        tests:
          - unique
          - not_null
      - name: siret
        description: Numéro SIRET de la cantine. = `siret` dans le RNC.
      - name: siren_unite_legale
        description: SIREN de l'unité légale. = `siren_unite_legale` dans le RNC.
      - name: groupe_id
        description: Identifiant du groupe auquel la cantine est rattachée. = `groupe_id` dans le RNC.
      - name: siret_cuisine_centrale
        description: SIRET de la cuisine centrale qui livre la cantine. = `central_producer_siret` dans le RNC.
      - name: claimed_by_id
        description: Identifiant de l'utilisateur qui a revendiqué la cantine.
      - name: nom
        description: Nom de la cantine. = `name` dans le RNC.
      - name: nbre_repas_jour
        description: Nombre de repas servis par jour. = `daily_meal_count` dans le RNC.
      - name: nbre_repas_an
        description: Nombre de repas servis par an. = `yearly_meal_count` dans le RNC.
      - name: type_production
        description: >
          Type de production, en code (groupe, central, central_serving, site, site_cooked_elsewhere).
          = `production_type` dans le RNC.
        tests:
          - accepted_values:
              values: ['groupe', 'central', 'central_serving', 'site', 'site_cooked_elsewhere']
      - name: type_gestion
        description: Mode de gestion, en code (direct, conceded). = `management_type` dans le RNC.
        tests:
          - accepted_values:
              values: ['direct', 'conceded']
      - name: modele_economique
        description: Modèle économique, en code (public, private). = `economic_model` dans le RNC.
        tests:
          - accepted_values:
              values: ['public', 'private']
      - name: ministere_tutelle
        description: >
          Ministère de tutelle, en code. Le code applicatif `justice` est éclaté par dbt en
          `justice_pjj` (cantines du secteur `social_pjj`) et `justice_hors_pjj`.
      - name: ministere_tutelle_lib
        description: >
          Libellé du ministère de tutelle (macro `libelle_ministere`). = `line_ministry` dans le RNC.
          `justice_pjj` et `justice_hors_pjj` donnent tous deux « Justice », comme le RNC.
      - name: groupe_spe
        description: >
          Regroupement SPE du ministère (macro `groupe_spe`) : MTE, MEJSESR, Justice,
          Ministères sociaux, AAI, ATE ; les autres ministères gardent leur code. Même règle
          que `cantine_groupe_spe` de mart_teledeclarations.
        tests:
          - accepted_values:
              values: ['MTE', 'MEJSESR', 'Justice', 'Ministères sociaux', 'AAI', 'ATE',
                       'affaires_etrangeres', 'agriculture', 'armee', 'territoires', 'culture',
                       'economie', 'transformation', 'interieur', 'premier_ministre']
      - name: is_spe
        description: >
          Vrai si la cantine a un ministère de tutelle (périmètre SPE). Même règle que
          `Canteen.is_spe` dans l'application : la chaîne vide ne compte pas.
      - name: secteurs
        description: >
          Libellés des secteurs d'activité, séparés par `,` sans espace, dans l'ordre où ils sont
          stockés (macro `libelles_secteurs`). = `sector_list` dans le RNC. Libellés et non codes :
          le code `administration_administratif` est contenu dans
          `administration_administratif_des_collectivites`, donc un filtre « contient » se
          tromperait sur les codes. Aucun des 26 libellés n'est contenu dans un autre.
          Remplace l'ancienne colonne `secteur` (liste de codes).
      - name: categories
        description: >
          Libellés des catégories de tous les secteurs, séparés par `,`, sans doublon, dans
          l'ordre de première apparition (macro `libelles_categories`). Même résultat que
          `get_category_lib_list_from_sector_list` dans l'application. Remplace l'ancienne
          colonne `categorie` (catégorie du premier secteur seulement).
      - name: code_insee_commune
        description: Code INSEE de la commune. = `city_insee_code` dans le RNC.
      - name: libelle_commune
        description: Libellé de la commune. = `city` dans le RNC.
      - name: code_postal
        description: Code postal. = `postal_code` dans le RNC.
      - name: departement
        description: Code département. = `department` dans le RNC.
      - name: departement_lib
        description: Libellé du département. = `department_lib` dans le RNC.
      - name: region
        description: Code région. = `region` dans le RNC.
      - name: region_lib
        description: Libellé de la région. = `region_lib` dans le RNC.
      - name: epci
        description: Code EPCI. = `epci` dans le RNC.
      - name: epci_lib
        description: Libellé de l'EPCI. = `epci_lib` dans le RNC.
      - name: pat_liste
        description: Codes des PAT de la cantine, séparés par `,`. = `pat_list` dans le RNC.
      - name: pat_lib_liste
        description: Libellés des PAT de la cantine, séparés par `,`. = `pat_lib_list` dans le RNC.
      - name: declaration_donnees_2021
        description: La cantine a déclaré ses données pour 2021. = `declaration_donnees_2021` dans le RNC.
      - name: declaration_donnees_2022
        description: La cantine a déclaré ses données pour 2022. = `declaration_donnees_2022` dans le RNC.
      - name: declaration_donnees_2023
        description: La cantine a déclaré ses données pour 2023. = `declaration_donnees_2023` dans le RNC.
      - name: declaration_donnees_2024
        description: La cantine a déclaré ses données pour 2024. = `declaration_donnees_2024` dans le RNC.
      - name: declaration_donnees_2025
        description: La cantine a déclaré ses données pour 2025. = `declaration_donnees_2025` dans le RNC.
      - name: est_perimetre_rnc
        description: >
          Vrai si la cantine figure dans le RNC : `Canteen.objects.publicly_visible()`
          (data/models/canteen.py:90) exclut les groupes et les cantines des armées.
          Les cantines sans type de production ou sans ministère restent dans le périmètre,
          comme avec le `exclude` de Django. Le nombre de cantines où ce booléen est vrai doit
          égaler le total du RNC publié sur data.gouv.
      - name: active_sur_ma_cantine
        description: >
          Vrai si la cantine a au moins un gestionnaire. = `active_on_ma_cantine` dans le RNC
          (api/serializers/canteen.py:802) : le code ne vérifie que la présence d'un gestionnaire,
          malgré la description du schéma data.gouv.
      - name: adresses_gestionnaires
        description: Emails des gestionnaires, séparés par `, `. Absent du RNC (donnée personnelle).
      - name: date_creation
        description: Date et heure de création de la cantine. = `creation_date` dans le RNC.
      - name: date_modification
        description: Date de dernière modification de la cantine. = `modification_date` dans le RNC.
      - name: creation_source
        description: Canal de création de la cantine (application, API, import…).

  - name: mart_teledeclarations
    description: >
      Une ligne par télédéclaration soumise (status = SUBMITTED).
      Exclut les cantines de type groupe et les diagnostics sans valeur totale ou bio.
      Source actuelle : diagnostics_raw. Les infos cantine viennent du canteen_snapshot JSON.
      Les colonnes sont préfixées cantine_ pour distinguer les infos cantine des données d'appro.
    tests:
      # 2022 exclue : deux diagnostics orphelins, sans cantine (TD 8501), font échouer ce test
      # et le not_null de canteen_id. Données 2022 peu utilisées pour les statistiques.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - canteen_id
            - annee
          config:
            where: "annee != 2022"
    columns:
      - name: teledeclaration_id
        description: >
          Identifiant de la télédéclaration. Non unique — plusieurs cantines satellites
          peuvent partager le même teledeclaration_id lorsqu'elles sont déclarées par un groupe.
        tests:
          - not_null
      - name: canteen_id
        description: >
          Identifiant de la cantine. Non unique — une cantine peut télédéclarer chaque année.
          La combinaison (canteen_id, annee) est unique.
        tests:
          # 2022 exclue : voir le test d'unicité du modèle (diagnostics orphelins de la TD 8501)
          - not_null:
              config:
                where: "annee != 2022"
      - name: annee
        description: Année de déclaration.
        tests:
          - not_null
      - name: version
        description: Version du format de télédéclaration.
      - name: date_teledeclaration
        description: Date à laquelle la télédéclaration a été soumise.
      - name: diagnostic_type
        description: Type de diagnostic (SIMPLE ou COMPLETE).
      - name: cantine_nom
        description: Nom de la cantine au moment de la télédéclaration (snapshot).
      - name: cantine_siret
        description: SIRET de la cantine au moment de la télédéclaration.
      - name: cantine_siren_unite_legale
        description: SIREN de l'unité légale au moment de la télédéclaration.
      - name: cantine_nbre_repas_jour
        description: Nombre de repas par jour au moment de la télédéclaration.
      - name: cantine_nbre_repas_an
        description: Nombre de repas par an au moment de la télédéclaration.
      - name: cantine_type_gestion
        description: >
          Mode de gestion de la cantine, en code. Les `''` hérités des snapshots sont conservés :
          les colonnes existantes de ce mart ne doivent pas changer de valeur.
        tests:
          - accepted_values:
              values: ['direct', 'conceded', '']
      - name: cantine_type_production
        description: >
          Type de production de la cantine, en code. Les groupes et cuisines centrales sont exclus
          du mart. Les `''` hérités des snapshots sont conservés.
        tests:
          - accepted_values:
              values: ['site', 'site_cooked_elsewhere', '']
      - name: cantine_modele_economique
        description: >
          Modèle économique de la cantine, en code. Les `''` hérités des snapshots sont conservés.
        tests:
          - accepted_values:
              values: ['public', 'private', '']
      - name: cantine_secteur
        description: >
          Secteur d'activité au moment de la TD, en code, ou « Secteurs multiples » dès que la
          cantine en a plusieurs. Règle propre à dbt : pour la liste complète, voir `cantine_secteurs`.
      - name: cantine_categorie
        description: >
          Catégorie du premier secteur seulement, au moment de la TD. Règle créée dans dbt :
          l'application, l'ancien ETL et le RNC utilisent la liste complète des catégories
          (voir `cantine_categories`). Conservée car le rapport 2026 l'utilise (question 3639) ;
          la règle du rapport 2027 reste à choisir avec ses rédacteurs.
      - name: cantine_groupe_spe
        description: >
          Regroupement SPE du ministère au moment de la TD : MTE, MEJSESR, Justice,
          Ministères sociaux, AAI, ATE ; les autres ministères gardent leur code, y compris le
          code retiré `autre` et la chaîne vide, hérités d'anciennes TD. Même règle que la macro
          `groupe_spe` utilisée par `groupe_spe` de mart_cantines.
        tests:
          - accepted_values:
              values: ['MTE', 'MEJSESR', 'Justice', 'Ministères sociaux', 'AAI', 'ATE',
                       'affaires_etrangeres', 'agriculture', 'armee', 'territoires', 'culture',
                       'economie', 'transformation', 'interieur', 'premier_ministre', 'autre', '']
      - name: cantine_ministere_tutelle
        description: Ministère de tutelle pour les cantines SPE.
      - name: cantine_spe
        description: Vrai si la cantine est sous périmètre ministériel.
      - name: cantine_departement
        description: Code département de la cantine.
      - name: cantine_region
        description: Code région de la cantine.
      - name: cantine_code_insee_commune
        description: Code INSEE de la commune.
      - name: email_gestionnaire
        description: Email du déclarant (applicant).
      - name: valeur_totale
        description: Valeur totale des achats alimentaires (€).
      - name: valeur_bio
        description: Valeur des achats bio (€).
      - name: valeur_egalim_avec_bio
        description: Valeur totale EGalim bio inclus (€).
      - name: valeur_egalim_sans_bio
        description: Valeur EGalim hors bio (€).
      - name: valeur_siqo
        description: Valeur des produits sous SIQO (€).
      - name: valeur_externalites_performance
        description: Valeur des produits externalités/performance (€).
      - name: valeur_egalim_autres
        description: Valeur des autres produits EGalim (€).
      - name: valeur_viandes_volailles
        description: Valeur totale viandes et volailles (€).
      - name: valeur_produits_de_la_mer
        description: Valeur totale produits de la mer (€).
      - name: valeur_viandes_volailles_egalim
        description: Valeur EGalim viandes et volailles (€).
      - name: valeur_produits_de_la_mer_egalim
        description: Valeur EGalim produits de la mer (€).
      - name: valeur_viandes_et_poissons
        description: Somme viandes volailles + produits de la mer (€).
      - name: valeur_viandes_et_poissons_egalim
        description: Somme EGalim viandes volailles + produits de la mer (€).
      - name: valeur_viandes_volailles_france
        description: Valeur viandes volailles d'origine France (€).
      - name: valeur_charcuterie_france
        description: Valeur charcuterie d'origine France (€).
      - name: valeur_produits_de_la_mer_france
        description: Valeur produits de la mer d'origine France (€).
      - name: valeur_fruits_et_legumes_france
        description: Valeur fruits et légumes d'origine France (€).
      - name: valeur_produits_laitiers_france
        description: Valeur produits laitiers d'origine France (€).
      - name: valeur_boulangerie_france
        description: Valeur boulangerie d'origine France (€).
      - name: valeur_boissons_france
        description: Valeur boissons d'origine France (€).
      - name: valeur_autres_france
        description: Valeur autres produits d'origine France (€).
      - name: pourcentage_bio
        description: Part des achats bio sur le total (%).
      - name: pourcentage_egalim
        description: Part des achats EGalim bio inclus sur le total (%).
      - name: pourcentage_egalim_hors_bio
        description: Part des achats EGalim hors bio sur le total (%).
      - name: objectifs_egalim_atteints
        description: Vrai si les objectifs EGalim sont atteints.
      - name: type_service
        description: Type de service de restauration.
      - name: recurrence_vege
        description: Fréquence hebdomadaire du menu végétarien.
      - name: type_menu_vege
        description: Type de menu végétarien proposé.
      - name: diag_gaspi
        description: La cantine a réalisé un diagnostic gaspillage.
      - name: plan_action_gaspi
        description: La cantine a un plan d'action anti-gaspillage.
      - name: action_gaspi_inscription
        description: Action gaspillage — inscription dans une démarche.
      - name: action_gaspi_sensibilisation
        description: Action gaspillage — sensibilisation des convives.
      - name: action_gaspi_formation
        description: Action gaspillage — formation du personnel.
      - name: action_gaspi_distribution
        description: Action gaspillage — optimisation de la distribution.
      - name: action_gaspi_portions
        description: Action gaspillage — adaptation des portions.
      - name: action_gaspi_reutilisation
        description: Action gaspillage — réutilisation des restes.
      - name: cantine_secteurs
        description: >
          Libellés des secteurs au moment de la TD (`canteen_snapshot`), séparés par `,`, dans
          l'ordre où ils sont stockés (macro `libelles_secteurs`). Même format que `secteurs`
          de mart_cantines et que `sector_list` dans le RNC. Figé au moment de la TD.
      - name: cantine_categories
        description: >
          Libellés des catégories de tous les secteurs au moment de la TD, séparés par `,`,
          sans doublon (macro `libelles_categories`). Même format que `categories` de
          mart_cantines. Figé au moment de la TD.
      - name: cantine_ministere_tutelle_lib
        description: >
          Libellé du ministère de tutelle au moment de la TD (macro `libelle_ministere`),
          à partir de `cantine_line_ministry`. Même format que `ministere_tutelle_lib` de
          mart_cantines et que `line_ministry` dans le RNC.

  - name: mart_waste
    description: >
      Une ligne par (canteen_id, annee) ayant au moins une mesure de gaspillage alimentaire valide.
      Les masses sont agrégées sur l'année civile via stg_waste_measurements.
      Les cantines avec un ratio hors plage [10, 500] g/couvert sont exclues (données aberrantes).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - canteen_id
            - annee
    columns:
      - name: canteen_id
        description: Identifiant de la cantine.
        tests:
          - not_null
      - name: annee
        description: Année civile des mesures.
        tests:
          - not_null
      - name: siret
        description: SIRET de la cantine.
      - name: cantine_name
        description: Nom de la cantine.
      - name: line_ministry
        description: Ministère de tutelle (SPE uniquement).
      - name: management_type
        description: Mode de gestion (direct, conceded).
      - name: production_type
        description: Type de production.
      - name: daily_meal_count
        description: Nombre de repas par jour déclaré sur la fiche cantine.
      - name: yearly_meal_count
        description: Nombre de repas par an déclaré sur la fiche cantine.
      - name: sector_list
        description: Secteurs d'activité (liste JSON).
      - name: department
        description: Code département.
      - name: department_lib
        description: Libellé du département.
      - name: region
        description: Code région.
      - name: region_lib
        description: Libellé de la région.
      - name: epci
        description: Code EPCI.
      - name: epci_lib
        description: Libellé de l'EPCI.
      - name: nb_mesures
        description: Nombre de mesures agrégées sur l'année.
      - name: total_meal_count
        description: Total couverts mesurés sur l'année.
      - name: total_mass_kg
        description: Masse totale de gaspillage (kg) sur l'année.
      - name: preparation_total_mass
        description: Masse totale flux préparation (kg).
      - name: preparation_edible_mass
        description: Masse comestible flux préparation (kg).
      - name: preparation_inedible_mass
        description: Masse non-comestible flux préparation (kg).
      - name: unserved_total_mass
        description: Masse totale flux non-servi (kg).
      - name: unserved_edible_mass
        description: Masse comestible flux non-servi (kg).
      - name: unserved_inedible_mass
        description: Masse non-comestible flux non-servi (kg).
      - name: leftovers_total_mass
        description: Masse totale flux restes assiette (kg).
      - name: leftovers_edible_mass
        description: Masse comestible flux restes assiette (kg).
      - name: leftovers_inedible_mass
        description: Masse non-comestible flux restes assiette (kg).
      - name: gaspi_g_par_couvert
        description: Ratio gaspillage en g/couvert (total_mass_kg × 1000 / total_meal_count).
      - name: niveau_ademe
        description: >
          Niveau ADEME calculé sur le ratio agrégé annuel :
          Niveau 3 (≤47 g/couvert), Niveau 2 (≤74), Niveau 1 (≤95), Non atteint (>95).

  - name: mart_api_applications
    description: >
      Une ligne par application OAuth2 (logiciel client de l'API), utilisée ou non : les
      colonnes de int_api_applications (éditeur, application de test), ses connexions et ses
      écritures réussies. Connexion = jeton obtenu ou renouvelé par le logiciel. Une
      application jamais utilisée garde sa ligne, avec des comptes à 0. Pas de statut calculé
      à la date du jour : il reste dans les cartes.
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    columns:
      - name: application_id
        description: Identifiant de l'application OAuth2.
        tests:
          - unique
          - not_null
      - name: application_nom
        description: Nom de l'application OAuth2.
      - name: editeur
        description: >
          Éditeur du logiciel : « nom de l'entreprise » saisi dans l'admin (fiche de
          l'application OAuth2), sinon « À qualifier : <nom de l'application> ».
      - name: est_a_qualifier
        description: Vrai si le « nom de l'entreprise » n'est pas renseigné dans l'admin.
      - name: est_test
        description: >
          Vrai si le nom de l'application évoque un test (test, recette, demo, dev), contient
          `<` ou `>`, ou est vide. Le « nom de l'entreprise » ne distingue pas les tests.
      - name: type_autorisation
        description: Type d'autorisation OAuth2 (authorization-code, client-credentials…).
      - name: proprietaire_domaine
        description: Domaine de l'email du propriétaire de l'application.
      - name: date_creation
        description: Date et heure de création de l'application.
      - name: premiere_connexion
        description: Première connexion (jeton obtenu ou renouvelé). Vide si jamais connectée.
      - name: derniere_connexion
        description: Dernière connexion (jeton obtenu ou renouvelé). Vide si jamais connectée.
      - name: nb_utilisateurs
        description: Nombre d'utilisateurs distincts connectés via l'application.
      - name: nb_jours_connexion
        description: >
          Nombre de couples (utilisateur, jour) distincts avec au moins une connexion, jour à
          l'heure de Paris.
      - name: nb_ecritures
        description: >
          Nombre de requêtes d'écriture API réussies faites avec l'application (EventLog,
          historique repris compris).
      - name: nb_utilisateurs_ayant_ecrit
        description: Nombre d'utilisateurs distincts ayant fait au moins une écriture réussie.
      - name: derniere_ecriture
        description: Date et heure de la dernière écriture réussie. Vide si aucune.

  - name: mart_api_connexions
    description: >
      Une ligne par (application, utilisateur, jour de connexion). Connexion = jeton obtenu ou
      renouvelé par un logiciel : au renouvellement, django-oauth-toolkit supprime le jeton
      d'accès et garde le jeton de renouvellement, repris pour ne pas sous-compter les
      logiciels qui renouvellent (voir int_api_connexions). `jour` est à l'heure de Paris.
      Pas d'email ni de nom : les cartes nominatives joignent `public.users_raw`.
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - application_id
            - user_id
            - jour
    columns:
      - name: jour
        description: Jour de connexion, à l'heure de Paris.
      - name: application_id
        description: Identifiant de l'application OAuth2.
      - name: application_nom
        description: Nom de l'application OAuth2.
      - name: editeur
        description: Éditeur du logiciel (voir mart_api_applications).
      - name: est_test
        description: Vrai pour une application de test (voir mart_api_applications).
      - name: user_id
        description: Utilisateur pour lequel le jeton a été obtenu. Vide pour quelques jetons.
      - name: utilisateur_est_equipe
        description: Vrai si l'utilisateur fait partie de l'équipe ma cantine (is_staff ou is_dev).
      - name: nb_jetons
        description: Nombre de jetons obtenus ou renouvelés ce jour-là.
      - name: premiere_connexion_du_jour
        description: Date et heure de la première connexion du jour.

  - name: mart_api_ecritures
    description: >
      Une ligne par requête d'écriture API (POST, PUT, PATCH, DELETE) faite avec un jeton
      OAuth2, réussie ou en échec, depuis EventLog : une écriture API = un événement `API`.
      En direct, toute requête journalisée a une application ; pour l'historique repris
      (`eventlog_backfill_api`), l'application peut manquer sur des requêtes antérieures au
      23/06/2026 (non stockée avant, et non retrouvée par les commandes fill).
      L'historique repris ne contient que des écritures réussies : les échecs ne sont
      journalisés que depuis le 16/10/2026. Jamais les GET. `jour` est à l'heure de Paris.
      Pas d'email ni de nom : les cartes nominatives joignent `public.users_raw`.
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    columns:
      - name: event_log_id
        description: Identifiant de l'événement EventLog.
        tests:
          - unique
          - not_null
      - name: date_ecriture
        description: Date et heure de la requête.
      - name: jour
        description: Jour de la requête, à l'heure de Paris.
      - name: route
        description: Route appelée, au format OpenAPI (ex. `/api/v1/canteens/{canteen_pk}/diagnostics/`).
      - name: type_donnees
        description: Données écrites, d'après la route (Bilans, Achats, Évaluations gaspillage, Cantines).
        tests:
          - accepted_values:
              values: ['Bilans', 'Achats', 'Évaluations gaspillage', 'Cantines', 'Autre']
      - name: action
        description: >
          Création, Modification, Suppression, Télédéclaration ou Annulation de télédéclaration,
          d'après la méthode et la route.
        tests:
          - not_null
      - name: objet_id
        description: >
          Identifiant de l'objet visé quand on le connaît : cantine créée, ou identifiant `{id}`
          du chemin. Vide pour une création de bilan, d'achat ou d'évaluation (route de
          collection) : la part télédéclarée des bilans créés se lit dans mart_api_bilans_crees.
      - name: est_reussie
        description: Vrai si la requête a réussi (code HTTP inférieur à 400).
      - name: code_http
        description: Code HTTP de la réponse.
      - name: message
        description: Réponse tronquée à 1 000 caractères pour une requête en échec, vide sinon.
      - name: application_id
        description: Identifiant de l'application OAuth2 (peut manquer pour des requêtes reprises, voir ci-dessus).
      - name: application_nom
        description: Nom de l'application OAuth2.
      - name: editeur
        description: Éditeur du logiciel (voir mart_api_applications).
      - name: est_test
        description: Vrai pour une application de test (voir mart_api_applications).
      - name: user_id
        description: Utilisateur authentifié par le jeton.
      - name: utilisateur_est_equipe
        description: Vrai si l'utilisateur fait partie de l'équipe ma cantine (is_staff ou is_dev).
      - name: canteen_id
        description: Cantine concernée (chemin de la requête, ou cantine créée).
      - name: est_repris
        description: Vrai si l'écriture a été reconstituée après coup (avant le 16/10/2026).

  - name: mart_api_bilans_crees
    description: >
      Une ligne par bilan créé via l'API par un logiciel connu
      (`creation_source_api_oauth2_application_id` renseigné). Les bilans de satellites générés
      depuis celui d'un groupe copient ses champs de création : ils sont exclus. Lu dans les
      bilans et non dans EventLog, qui ne connaît pas l'identifiant du bilan créé : c'est ici
      que se lit la part télédéclarée des bilans créés via l'API. `jour_creation` est à l'heure
      de Paris.
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    columns:
      - name: diagnostic_id
        description: Identifiant du bilan.
        tests:
          - unique
          - not_null
      - name: canteen_id
        description: Identifiant de la cantine.
      - name: annee_bilan
        description: Année du bilan.
      - name: date_creation
        description: Date et heure de création du bilan.
      - name: jour_creation
        description: Jour de création du bilan, à l'heure de Paris.
      - name: application_id
        description: Identifiant de l'application OAuth2 qui a créé le bilan.
      - name: application_nom
        description: Nom de l'application OAuth2.
      - name: editeur
        description: Éditeur du logiciel (voir mart_api_applications).
      - name: est_test
        description: Vrai pour une application de test (voir mart_api_applications).
      - name: user_id
        description: Utilisateur qui a créé le bilan.
      - name: statut
        description: Statut du bilan (DRAFT, SUBMITTED…).
      - name: est_teledeclare
        description: Vrai si le bilan est télédéclaré (statut SUBMITTED).
      - name: date_teledeclaration
        description: Date et heure de la télédéclaration.

  - name: mart_imports
    description: >
      Une ligne par tentative d'import de fichier (événement IMPORT d'EventLog), réussie ou en
      échec. Historique repris : imports réussis depuis 12/2022, échecs depuis 03/2024
      (data_importfailure). Les types d'import sont regroupés par famille, car les noms
      d'échecs anciens (PURCHASE, CANTEEN_ONLY_OR_DIAGNOSTIC_SIMPLE, DIAGNOSTIC_SIMPLE) n'ont
      pas d'équivalent côté succès. `jour` est à l'heure de Paris. Pas d'email ni de nom : les
      cartes nominatives joignent `public.users_raw`.
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    columns:
      - name: event_log_id
        description: Identifiant de l'événement EventLog.
        tests:
          - unique
          - not_null
      - name: date_import
        description: Date et heure de l'import.
      - name: jour
        description: Jour de l'import, à l'heure de Paris.
      - name: type_import
        description: Type d'import, en code (PURCHASE_SIRET, CANTEEN_CREATE…).
      - name: famille_import
        description: Famille d'import (Achats, Bilans, Cantines, Gestionnaires).
        tests:
          - accepted_values:
              values: ['Achats', 'Bilans', 'Cantines', 'Gestionnaires', 'Autre']
      - name: est_reussi
        description: Vrai si l'import a réussi.
      - name: motif_echec
        description: >
          Motif de l'échec regroupé en une dizaine de catégories (règle de la carte 3811),
          vide pour un import réussi.
      - name: schema_validata
        description: Schéma Validata cité dans le message d'échec, le cas échéant.
      - name: message
        description: Détail de l'échec, vide pour un import réussi.
      - name: nb_lignes
        description: Nombre de lignes importées.
      - name: duree_secondes
        description: Durée de l'import, en secondes (imports journalisés en direct seulement).
      - name: user_id
        description: Utilisateur qui a importé le fichier. Souvent vide pour les imports d'achats repris.
      - name: utilisateur_est_equipe
        description: Vrai si l'utilisateur fait partie de l'équipe ma cantine (is_staff ou is_dev).
      - name: canteen_id
        description: Cantine concernée, le cas échéant.
      - name: est_repris
        description: >
          Vrai si l'import a été reconstitué après coup ou migré depuis data_importfailure
          (avant le 16/10/2026).
      - name: type_import_incertain
        description: >
          Vrai si le type d'import a été déduit lors de la reprise : imports d'achats repris
          (SIRET et ID indiscernables, tous nommés PURCHASE_SIRET) et une partie des imports de
          bilans repris. Vide pour les échecs et les imports journalisés en direct.

  - name: mart_spe_pilotage
    description: >
      Pilotage de la campagne de télédéclaration pour les RSPE (tableau de bord Metabase).
      Une ligne par restaurant du périmètre État (int_spe_perimetre) et par année de données,
      Armées incluses (`est_armees` sépare le tableau commun du tableau Armées). n-1 = la ligne de
      l'année précédente. Restaurant, tutelle et gestionnaires : état du jour (mart_cantines), pas
      celui figé dans la TD. Les chiffres diffèrent donc du bilan SPE (mart_spe_bilan, figé au
      29/04 n+1). Indicateurs de la mesure 10 : repris de mart_teledeclarations, vides sans TD
      retenue. Cibles et calendrier absents : les questions Metabase les lisent dans les tables
      téléversées par la DGAL (le taux dépend des filtres du tableau).
      Les tests de ce mart ne tournent qu'en dev : la tâche de nuit lance `dbt run`, pas `dbt test`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - canteen_id
            - annee
    columns:
      - name: canteen_id
        description: Identifiant de la cantine.
        tests:
          - not_null
      - name: siret
        description: SIRET de la cantine (état du jour).
      - name: nom
        description: Nom de la cantine (état du jour).
      - name: groupe_id
        description: Identifiant du groupe auquel la cantine est rattachée.
      - name: groupe_nom
        description: Nom du groupe auquel la cantine est rattachée.
      - name: type_production
        description: >
          Type de production, en code (groupe, central, central_serving, site, site_cooked_elsewhere).
      - name: type_gestion
        description: Mode de gestion, en code (direct, conceded).
      - name: nbre_repas_jour
        description: Nombre de repas servis par jour.
      - name: nbre_repas_an
        description: Nombre de repas servis par an.
      - name: date_inscription
        description: >
          Jour de création de la cantine sur ma cantine (UTC). Sert à recalculer le statut à une
          date passée (filtre « État au » du tableau de bord).
      - name: perimetre_key
        description: >
          Tutelle actuelle, en code dbt de `ministere_tutelle` (Justice éclatée en justice_pjj /
          justice_hors_pjj), ou tutelle forcée par une correction de la DGAL.
        tests:
          - not_null
      - name: perimetre_lib
        description: Libellé de la tutelle (référentiel de la DGAL).
      - name: pole_ministeriel
        description: >
          Pôle ministériel de la tutelle (référentiel de la DGAL). Un avertissement du test
          signale une tutelle absente du référentiel.
        tests:
          - not_null:
              config:
                severity: warn
      - name: ordre_affichage
        description: Ordre d'affichage de la tutelle (référentiel de la DGAL).
      - name: est_armees
        description: Vrai pour les restaurants des Armées (tableau de bord séparé).
      - name: secteurs
        description: >
          Libellés des secteurs d'activité, séparés par `,` sans espace (macro `libelles_secteurs`).
      - name: secteur
        description: Libellé du secteur si la cantine n'en a qu'un, « Secteurs multiples » sinon.
      - name: code_insee_commune
        description: Code INSEE de la commune.
      - name: libelle_commune
        description: Libellé de la commune.
      - name: departement
        description: Code département.
      - name: departement_lib
        description: Libellé du département.
      - name: region
        description: Code région.
      - name: region_lib
        description: Libellé de la région.
      - name: adresses_gestionnaires
        description: Emails des gestionnaires du restaurant, séparés par `, `.
      - name: adresses_relance
        description: >
          Courriels à relancer : ceux des gestionnaires du groupe pour un satellite dont le groupe
          en a, sinon ceux du restaurant. Séparés par `, `.
      - name: annee
        description: Année des données déclarées (année n, campagne en n+1).
        tests:
          - not_null
      - name: statut_td
        description: >
          Télédéclaré (TD retenue dans mart_teledeclarations), En cours (diagnostic de l'année en
          brouillon ou en correction, sur la cantine ou sur son groupe) ou À relancer.
          Voir int_campagne_statut.
        tests:
          - not_null
          - accepted_values:
              values: ['Télédéclaré', 'En cours', 'À relancer']
      - name: teledeclaration_id
        description: Identifiant de la TD retenue, vide sinon.
      - name: date_teledeclaration
        description: >
          Jour de la télédéclaration retenue, à l'heure de Paris. Sert à recalculer le statut à
          une date passée (filtre « État au » du tableau de bord).
      - name: date_debut_saisie
        description: >
          Jour de création du premier diagnostic de l'année, sur la cantine ou sur son groupe, à
          l'heure de Paris. Sert à recalculer le statut à une date passée (filtre « État au » du
          tableau de bord).
      - name: date_modification_saisie
        description: >
          Jour de dernière modification d'un diagnostic de l'année en brouillon ou en correction,
          sur la cantine ou sur son groupe, à l'heure de Paris.
      - name: td_complete
        description: Vrai si la cantine était renseignée au moment de la TD retenue.
      - name: td_generee_par_groupe
        description: Vrai si la TD retenue a été générée depuis celle du groupe de la cantine.
      - name: en_cours_via_groupe
        description: >
          Vrai si la cantine est En cours seulement grâce au diagnostic en brouillon ou en
          correction de son groupe.
      - name: td_deposee_non_retenue
        description: >
          Vrai si une TD a été déposée pour l'année mais écartée de mart_teledeclarations
          (valeurs aberrantes, valeur totale vide…).
      - name: valeur_totale
        description: Valeur totale des achats alimentaires (€) de la TD retenue.
      - name: valeur_bio_agg
        description: Valeur des achats bio (€), agrégée. À réagréger par somme / somme dans Metabase.
      - name: valeur_egalim_agg
        description: Valeur des achats EGalim (€), agrégée. À réagréger par somme / somme dans Metabase.
      - name: valeur_viandes_et_poissons
        description: Somme viandes volailles + produits de la mer (€).
      - name: valeur_viandes_et_poissons_egalim
        description: Somme EGalim viandes volailles + produits de la mer (€).
      - name: atteint_bio
        description: Objectif bio atteint, seuil selon la zone (voir `seuil_applicable`).
      - name: atteint_egalim
        description: Objectif EGalim atteint, seuil selon la zone (voir `seuil_applicable`).
      - name: atteint_viandes_et_poissons_egalim
        description: >
          Objectif viandes et poissons EGalim atteint (100 % pour une cantine avec une tutelle au
          moment de la TD, 60 % sinon ; règle de mart_teledeclarations).
      - name: seuil_applicable
        description: >
          Seuils EGalim / bio de la zone de la TD retenue (Métropole, DROM, Mayotte), même règle
          que les `atteint_*` de mart_teledeclarations. Vide sans TD retenue.
      - name: choix_multiple
        description: Vrai si la cantine propose plusieurs menus (service autre qu'unique).
      - name: atteint_vege_quotidien
        description: Vrai si la cantine propose plusieurs menus et une option végétarienne quotidienne.
      - name: td_volet_diversification_complet
        description: Vrai si le volet diversification de la TD est complet.
      - name: gaspi_total_mass_kg
        description: >
          Masse totale de gaspillage mesurée sur l'année (kg). Mesures hors plage 10 à 500 g par
          couvert écartées dans mart_teledeclarations.
      - name: gaspi_meal_count
        description: Nombre de couverts des mesures de gaspillage de l'année.
      - name: gaspi_g_par_couvert
        description: Ratio gaspillage en g par couvert, arrondi à 0,1.
      - name: niveau_ademe
        description: >
          Niveau ADEME de gaspillage (Niveau 3 ≤ 47 g, Niveau 2 ≤ 74 g, Niveau 1 ≤ 95 g, Non
          atteint au-delà), calculé sur le ratio non arrondi comme int_spe_waste_by_canteen.
