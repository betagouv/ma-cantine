version: 2

sources:
  - name: datawarehouse
    description: >
      Tables already present in the data warehouse, loaded by the existing Python ETL.
      These can be used as sources immediately without FDW.
    schema: public
    tables:
      - name: teledeclarations
        description: Télédéclarations loaded by the Python ETL. Will be obsolete once 1td1site is live.
      - name: canteens_raw
        description: Raw canteen data dumped from the production database (including deleted ones, see deletion_date).
      - name: canteen_managers_raw
        description: Raw canteen-manager relationships dumped from the production database.
      - name: diagnostics_raw
        description: Raw diagnostics dumped from the production database (including deleted ones, see deletion_date).
      - name: purchases_raw
        description: Raw purchases dumped from the production database (including deleted ones, see deletion_date).
      - name: users_raw
        description: Raw user data dumped from the production database.
      - name: waste_measurements_raw
        description: Raw waste measurements dumped from the production database.
      - name: oauth2_applications_raw
        description: Raw OAuth2 applications (API clients) dumped from the production database (without client_secret).
      - name: oauth2_access_tokens_raw
        description: Raw OAuth2 access tokens dumped from the production database (without token & token_checksum).
      - name: oauth2_refresh_tokens_raw
        description: Raw OAuth2 refresh tokens dumped from the production database (without token).
