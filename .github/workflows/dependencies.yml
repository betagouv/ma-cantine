name: "ma cantine: dependencies"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/dependencies.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "backend"
    runs-on: ubuntu-latest
    # Skip if PR is in draft
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      # requirements.txt is used by Clever Cloud (pip), uv.lock by CI and local dev: they must stay in sync
      # (e.g. Dependabot security updates sometimes only update requirements.txt)
      - name: Check uv.lock is up to date with pyproject.toml
        run: |
          uv lock --check

      - name: Check requirements.txt is up to date with uv.lock
        run: |
          uv export --no-hashes --output-file=requirements.txt
          git diff --exit-code requirements.txt
